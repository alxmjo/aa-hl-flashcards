name: Build and release deck

# Runs when a release is published (from the GitHub website or the API),
# so students only ever receive a deck that has been tested.
# A pushed tag (v*) also publishes: the workflow then creates the release itself, with the title
# and notes from release-notes/<tag>.md (first line: the title; the rest: the notes).
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install genanki
        run: pip install -r requirements.txt

      - name: Build deck
        run: bash build.sh

      - name: Check the deck was built
        run: test -s dist/IB_Math_AA_HL.apkg

      - name: Keep a copy on the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: IB_Math_AA_HL
          path: dist/IB_Math_AA_HL.apkg

      - name: Read the release notes for a pushed tag
        if: github.event_name == 'push'
        id: notes
        run: |
          f="release-notes/${GITHUB_REF_NAME}.md"
          test -s "$f" || { echo "missing $f"; exit 1; }
          echo "title=$(head -n 1 "$f")" >> "$GITHUB_OUTPUT"
          tail -n +2 "$f" > dist/notes.md

      - name: Create the release from a pushed tag
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: dist/notes.md
          files: dist/IB_Math_AA_HL.apkg

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IB_Math_AA_HL.apkg
